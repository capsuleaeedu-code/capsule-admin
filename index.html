<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Capsule Educational Institute</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        header {
            background: #0b1f3a;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
        }

        .location {
            font-size: 14px;
            opacity: 0.9;
        }

        main {
            max-width: 1000px;
            margin: 70px auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .subtitle {
            color: #667085;
            margin-bottom: 40px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .button {
            display: inline-block;
            padding: 15px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
        }

        .admin {
            background: #f97316;
            color: white;
        }

        .staff {
            background: #0b1f3a;
            color: white;
        }

        footer {
            margin-top: 100px;
            color: #98a2b3;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 30px;
            }

            header {
                padding: 15px 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        Capsule Educational Institute
    </div>

    <div class="location">
        Abu Dhabi, UAE
    </div>
</header>

<main>

    <h1>Capsule Management System</h1>

    <p class="subtitle">
        Staff, Leads, Admissions, Payments & Attendance
    </p>

    <div class="buttons">

        <a href="login.html" class="button admin">
            Admin Login
        </a>

        <a href="login.html" class="button staff">
            Staff Login
        </a>

    </div>

    <footer>
        © 2026 Capsule Educational Institute
    </footer>

</main>

</body>
</html>
